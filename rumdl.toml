# ===========================================================================
# styx documentation gate — rumdl 0.2.75, pinned exactly.
#
# This repository carries far more markdown than Rust: the SPDD contracts under
# spdd/ are what the code is generated from, and the ADRs are the only
# surviving record of why the gate has the shape it has. Documentation is a
# deliverable here, not a by-product, so it is gated like one.
#
# ONE POLICY, applied to every document.
#
# This file used to carry a [per-file-ignores] block exempting spdd/** from the
# line-length rule, because those documents are emitted by the /spdd-* commands
# and a wrapping rule those commands did not implement would have failed on the
# next generated document through no author's fault.
#
# That exemption is gone, and it was retired the way it was always supposed to
# be — by removing the reason for it, not by widening it:
#
#   1. The five /spdd-* command definitions in .claude/commands/ were given a
#      "Markdown Output Norms" block, so generated documents are now written to
#      this policy in the first place.
#   2. The 26 existing contracts were reflowed to 90 columns in one pass, and
#      the handful of over-long headings that no reflow can fix were shortened
#      by moving their qualifiers into the body.
#
# If a generated document ever fails this gate again, the fix is to correct
# what the command emits — not to reintroduce an exemption here.
# ===========================================================================

[global]
# Build output and untracked scratch files are never documents.
respect_gitignore = true

exclude = [
    "target/**",
    # Vendored tool definitions. The /spdd-* files here ARE now maintained by
    # this project, so this exclusion is weaker than it reads.
    #
    # They have been brought most of the way in: the cosmetic findings and the
    # prose wrapping are fixed, leaving 43. Those 43 are all one decision —
    # whether these files' section markers become real headings. MD036 (24)
    # wants `**Steps**` / `**Output**` / `**Guardrails**` turned into `##`
    # headings; MD041 (5) wants an H1 after the YAML frontmatter; MD023 and
    # MD035 (7 each) want the seven REASONS stage headings and their rules
    # un-indented out of step 3, which would promote them from content nested
    # inside one step to top-level sections of the document.
    #
    # That is a change to what a model reads when the command runs, not a lint
    # fix, which is why it has not been made and why this exclusion stays.
    ".claude/**",
    # Fixture E is a DELIBERATE violation and must not fail the normal run.
    #
    # *** IT IS LINTED ANYWAY, AND THE HOW MATTERS. ***
    #
    # rumdl does NOT lint an excluded file just because it was named on the
    # command line — an explicitly-passed excluded path is still filtered out,
    # and the run exits 0 reporting "filtered out". A self-test that simply
    # pointed rumdl at this fixture would therefore pass while proving
    # nothing. `just gate-selftest` passes --no-exclude for exactly this
    # reason. Verified empirically; do not remove that flag.
    "gate-selftest/fixture-e-markdown/**",
]

[MD013]
# 90, not the default 80, because 90 is the width the ADRs and the SPDD canvases
# are wrapped to. At 80 this gate would have started red with findings that are
# stylistic disagreements rather than defects, and a gate that starts red
# teaches people to ignore it.
line-length = 90

# Three things this rule cannot meaningfully ask anyone to wrap, and so does not:
#
#   tables       (default: exempt) — a column cannot be broken across lines.
#   code-blocks  — a directory tree, a console transcript or a code sample means
#                  exactly what its layout says. Rewrapping one corrupts it.
#   code-spans   — a line whose length is driven by a single inline code span,
#                  such as a full type signature, has no break point in it.
#
# These are exemptions for text that *cannot* be wrapped, not for text that is
# merely inconvenient to wrap. Prose has no exemption.
code-blocks = false
code-spans = false
