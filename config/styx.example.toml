# Example styx configuration: a recursor first, a public forwarder as standby.
#
# Copy to styx.toml (or pass the path as the first argument) and adjust. styx exits at
# startup when there is no styx.toml in the current directory and no path is given.
#
# Every key the server, supervisor, upstream, cache and recursion sections accept appears below,
# live or as a commented-out line showing its built-in default. Uncomment a line to
# change it.

# Addresses for the UDP and TCP listeners. The built-in default is 127.0.0.1:53, a
# privileged port; this example uses 5300 so it starts without elevated rights.
listen_addrs = ["127.0.0.1:5300"]

# Whole-query deadline in seconds. It must exceed the longest `udp_timeout_ms` or
# `tcp_timeout_ms` of any upstream member, or styx refuses to start. Shutdown also waits
# this long for in-flight queries, and each one holds a concurrency slot until it ends, so
# with every upstream dead the server sustains about `max_in_flight_queries` divided by
# this many queries per second (roughly 200 at the defaults).
query_timeout_secs = 5

# EDNS payload size advertised to clients that send none.
# udp_payload_size_default = 1232

# Seconds an idle TCP client connection is kept open.
# tcp_idle_timeout_secs = 5

# Caps on concurrent client work. Both must be non-zero.
# max_in_flight_queries = 1024
# max_tcp_connections = 256

# Answer every AAAA question NOERROR with no records, without asking an upstream, so
# clients on a network with a broken IPv6 path fall back to IPv4. A local record for the
# name still answers, and a blocked name is still blocked.
# filter_aaaa = false

# How the listener supervisor backs off when a listener task dies.
# [supervisor]
# initial_backoff_ms = 50
# max_backoff_secs = 2
# healthy_threshold_secs = 60

[upstream]
# One of: ordered_failover, round_robin, weighted, race. `race` sends every query to
# every member at once, so it tells all providers what you resolve.
strategy = "ordered_failover"

# The iterative recursor. `addr` is required by the pool schema but unused for a
# recursor: it finds its servers by walking down from the root.
[[upstream.members]]
name = "recursor"
kind = "recursor"
addr = "0.0.0.0:0"

# Health probe for this member. Each kind of member has its own default canary; this is
# the recursor's. A recursor canary must name something below the root that needs a
# descent, so a name with two or more labels. qtype is A, AAAA, NS or TXT.
# [upstream.members.canary]
# qname = "root-canary.iana.org."
# qtype = "NS"
# timeout_ms = 5000

[[upstream.members]]
name = "quad9"
kind = "forwarder"
addr = "9.9.9.9:53"
# Share of traffic under the `weighted` strategy; ignored by the others.
# weight = 1
# EDNS buffer size sent upstream, at least 512.
# edns_buffer = 1232
# Per-query timeouts toward this member, in milliseconds. Both must stay below
# `query_timeout_secs`.
# udp_timeout_ms = 2000
# tcp_timeout_ms = 3000

# Health probe for this member, with the forwarder default canary. When a canary table
# omits timeout_ms, the timeout is the default for the member's kind.
# [upstream.members.canary]
# qname = "probe.canary.invalid."
# qtype = "A"
# timeout_ms = 2000

# Active probing of members that have been idle or are marked down.
# [upstream.probe]
# idle_window_secs = 60
# down_retry_secs = 10
# tick_secs = 1

# Circuit breaker applied to every member.
# [upstream.circuit]
# failure_threshold = 3
# open_cooldown_secs = 30
# half_open_successes = 2

# The answer cache. The bounds cover the whole cache and are split evenly across the
# shards once, at startup, so a shard never holds more than its share. Each shard's byte
# share must hold one large answer: `max_bytes` must be at least 256 KiB times `shards`
# (8 MiB at 32 shards), `max_entries` at least `shards`, and styx refuses to start
# otherwise. Fewer shards lets small budgets work at the cost of write concurrency.
# [cache]
# max_entries = 10000
# max_bytes = 20971520
# shards = 32

# Infrastructure for the recursor. The root-hints file is the only source of root
# servers: a missing or unparseable file stops styx at startup.
[recursion]
root_hints = "config/named.root"
# This path is relative to the directory styx is started from, so run styx from the
# repository root or change it to an absolute path.
# Denial-of-service bounds per client question.
max_depth = 16
max_outbound_queries = 64
max_cname_chain = 8
wall_clock_ms = 4000
# Per-query timeouts toward authoritative servers.
udp_timeout_ms = 800
tcp_timeout_ms = 1500
# Set to false on a box with no IPv6 path, so AAAA glue is never tried.
use_ipv6 = true
# Bounds on how many delegations and nameservers the recursor remembers.
# max_delegations = 10000
# max_servers = 10000
