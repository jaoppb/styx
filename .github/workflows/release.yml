name: release

# The path phase 12 uses for the cutover artifacts. It exists now so that it is
# not written under pressure at the end, and so the musl build is exercised
# before anything depends on it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  artifacts:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The cutover host and the spare, respectively. `docker_arch` is the
          # platform's name in Docker, which the image's Dockerfile looks the
          # binary up by.
          - target: x86_64-unknown-linux-musl
            docker_arch: amd64
          - target: aarch64-unknown-linux-musl
            docker_arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # cross is pinned in mise.toml, the same file arch-lint/rumdl/just/
      # lefthook are pinned in. Static musl binaries, so the cutover does not
      # inherit the host's libc.
      - uses: jdx/mise-action@v5

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }} --package styx

      - name: Package
        run: |
          set -euo pipefail
          staging="styx-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/styx" "$staging/"
          cp README.md "$staging/" 2>/dev/null || true
          tar czf "${staging}.tar.gz" "$staging"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            styx-*.tar.gz
            styx-*.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.docker_arch }}
          path: target/${{ matrix.target }}/release/styx
          if-no-files-found: error

  image:
    name: OCI image
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The binaries built above, not a rebuild. The artifact zip drops the
      # executable bit; the Dockerfile's COPY --chmod restores it.
      - uses: actions/download-artifact@v8
        with:
          name: image-amd64
          path: image-context/amd64
      - uses: actions/download-artifact@v8
        with:
          name: image-arm64
          path: image-context/arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the repository for the image name, and tags the image
      # with the release version.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: image-context
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
