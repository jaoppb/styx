name: quality

# Enforcement that cannot be bypassed. The lefthook hooks run the same `gate`
# target locally, but they are bypassable with `--no-verify`; this is not.
on:
  push:
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version, the components and the musl
      # targets. Nothing here restates them, so the pin has one home.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # arch-lint, rumdl, just and lefthook are all pinned once, in mise.toml.
      # This action installs mise itself, then runs `mise install` against that
      # file — the same `mise install` behind `just install-tools` — and puts
      # its shims on PATH, so the `just gate` step below finds a `just` binary
      # without a separate setup-just step, at the version this file pins.
      - uses: jdx/mise-action@v5

      # The whole per-push gate, in one step, via the same target a developer
      # runs. Hermetic: no network, no external service, no live DNS.
      - name: just gate
        run: just gate

      # Reported separately, although `gate` already covers it, so a headless
      # regression is legible in the job list rather than buried in an
      # aggregate. It passes near-vacuously until phase 11 gives the `web`
      # feature real code to gate.
      - name: just headless
        run: just headless

      # "Is the gate alive?" answered on every push rather than once, at the
      # end of phase 0. An inert config and a passing config emit the same exit
      # code; this step is the only thing that tells them apart.
      - name: just gate-selftest
        run: just gate-selftest
