# ===========================================================================
# styx architecture enforcement — arch-lint 0.6.0, syn engine.
#
#   *** THE ABSENCE OF A [[layers]] BLOCK IS LOAD-BEARING. ***
#
# arch-lint has two mutually exclusive engines, selected by whether this file
# contains a [[layers]] table (arch-lint-cli-0.6.0/src/main.rs:153).
#
#   With [[layers]]:    the tree-sitter engine runs. It ships exactly one
#                       grammar, tree-sitter-kotlin-ng, and filters discovery
#                       to .kt/.kts. On a Rust repository it analyses ZERO
#                       files and exits 0 — and, because it is selected, it
#                       also silently disables AL001-AL013.
#
#   Without [[layers]]: the syn engine runs. It executes AL001-AL013 plus the
#                       declarative [[scopes]], [[deny-scope-dep]] and
#                       [[restrict-use]] rules below, enforcing layering on
#                       Rust by path glob.
#
# The file this replaced contained [[layers]]. It had been green since the day
# it was committed, having checked nothing at all. An enforcement tool that
# checks nothing and one that finds nothing wrong emit the same exit code.
#
# Do NOT reintroduce [[layers]], and do NOT "simplify" this file without
# running `just gate-selftest` afterwards. See docs/adr/0001.
# ===========================================================================

# strict = all rules (AL001-AL007, AL009-AL013; note AL008 does not exist).
preset = "strict"

# Violations at or above this severity fail the run.
fail_on = "error"

[analyzer]
root = "."
# Declaring this table replaces the built-in default, so target/ and vendor/
# must be listed explicitly here or they come back into the analysis.
exclude = [
    "**/target/**",
    "**/vendor/**",
]
# Only these trees are analysed.
#
# This is an ALLOWLIST rather than an exclude of `gate-selftest/**`, and the
# distinction is load-bearing. `analyzer.exclude` falls back to a plain
# SUBSTRING match against the absolute path
# (arch-lint-core-0.6.0/src/analyzer.rs:527), so excluding the fixture
# directory would also hide the fixtures when `just gate-selftest` points the
# analyser straight at one — discovery would report zero files and every
# fixture would "pass". An include pattern is matched against the path
# relative to the analysis root, so:
#
#   root = repo      -> a fixture is `gate-selftest/.../crates/...`: not included.
#   root = a fixture -> the same file is `crates/...`: included and analysed.
#
# One configuration, correct in both directions.
include = [
    "crates/**",
    "xtask/**",
]
respect_gitignore = true

# ---------------------------------------------------------------------------
# Rule options.
#
# Test code may use the panicking constructs production code is denied — the
# same exemption posture as clippy.toml's four allow-*-in-tests entries.
# Unknown option names are a hard error, not a silent ignore.
# ---------------------------------------------------------------------------
[rules.no-unwrap-expect]
allow_in_tests = true
allow_expect = false

[rules.no-panic-in-lib]
allow_in_tests = true

[rules.no-silent-result-drop]
allow_in_tests = true

[rules.async-trait-send-check]
# DNS listeners, Leptos SSR and background workers share state across a
# multi-threaded tokio runtime from phase 2 onward.
runtime_mode = "multi-thread"

# ===========================================================================
# Scopes — one per feature crate x layer, keyed by path glob.
#
#   *** THE SECOND GLOB IN EACH LAYER SCOPE IS LOAD-BEARING. ***
#
# [[deny-scope-dep]] resolves a `crate::a::b` use path to the candidate file
# paths `src/a/b.rs` and `src/a/b/mod.rs`, RELATIVE TO THE ANALYSIS ROOT
# (arch-lint-core-0.6.0/src/declarative/rules/scope_dep.rs:118) — it assumes a
# single-crate layout. In this workspace the real file is
# `crates/<crate>/src/a/b/mod.rs`, which that candidate never matches.
#
# With only the `crates/**` glob, the layering rules match nothing and the run
# exits 0. That is the inert-config failure in a new dress, and it was
# confirmed empirically before this file was written.
#
# The `src/<layer>/**` glob is what the synthetic candidate path resolves
# against. It matches no real file in a workspace layout, so it cannot
# mis-attribute one. Fixture B is the only thing that catches its removal.
# ===========================================================================

[[scopes]]
name = "styx-proto"
paths = ["crates/styx-proto/src/**"]

[[scopes]]
name = "styx-proto-domain"
paths = ["crates/styx-proto/src/domain/**", "src/domain/**"]

[[scopes]]
name = "styx-proto-application"
paths = ["crates/styx-proto/src/application/**", "src/application/**"]

[[scopes]]
name = "styx-proto-infrastructure"
paths = ["crates/styx-proto/src/infrastructure/**", "src/infrastructure/**"]

[[scopes]]
name = "styx-core"
paths = ["crates/styx-core/src/**"]

[[scopes]]
name = "styx-core-domain"
paths = ["crates/styx-core/src/domain/**", "src/domain/**"]

[[scopes]]
name = "styx-core-infrastructure"
paths = ["crates/styx-core/src/infrastructure/**", "src/infrastructure/**"]

[[scopes]]
name = "styx-net"
paths = ["crates/styx-net/src/**"]

[[scopes]]
name = "styx-net-domain"
paths = ["crates/styx-net/src/domain/**", "src/domain/**"]

[[scopes]]
name = "styx-net-infrastructure"
paths = ["crates/styx-net/src/infrastructure/**", "src/infrastructure/**"]

[[scopes]]
name = "styx-resolution"
paths = ["crates/styx-resolution/src/**"]

[[scopes]]
name = "styx-resolution-domain"
paths = ["crates/styx-resolution/src/domain/**", "src/domain/**"]

[[scopes]]
name = "styx-resolution-application"
paths = ["crates/styx-resolution/src/application/**", "src/application/**"]

[[scopes]]
name = "styx-resolution-infrastructure"
paths = ["crates/styx-resolution/src/infrastructure/**", "src/infrastructure/**"]

[[scopes]]
name = "styx-recursion"
paths = ["crates/styx-recursion/src/**"]

[[scopes]]
name = "styx-recursion-domain"
paths = ["crates/styx-recursion/src/domain/**", "src/domain/**"]

[[scopes]]
name = "styx-recursion-application"
paths = ["crates/styx-recursion/src/application/**", "src/application/**"]

[[scopes]]
name = "styx-recursion-infrastructure"
paths = ["crates/styx-recursion/src/infrastructure/**", "src/infrastructure/**"]

[[scopes]]
name = "styx-filtering"
paths = ["crates/styx-filtering/src/**"]

[[scopes]]
name = "styx-filtering-domain"
paths = ["crates/styx-filtering/src/domain/**", "src/domain/**"]

[[scopes]]
name = "styx-filtering-application"
paths = ["crates/styx-filtering/src/application/**", "src/application/**"]

[[scopes]]
name = "styx-filtering-infrastructure"
paths = ["crates/styx-filtering/src/infrastructure/**", "src/infrastructure/**"]

[[scopes]]
name = "styx-testkit"
paths = ["crates/styx-testkit/src/**"]

[[scopes]]
name = "styx-bin"
paths = ["crates/styx/src/**"]

# ===========================================================================
# Layering — Structure rules 1-3, one denial per edge that must not exist.
#
# The `message` teaches the invariant rather than merely rejecting: the
# failure text is the only documentation most readers will ever see.
# ===========================================================================

[[deny-scope-dep]]
name = "resolution-domain-outward"
from = "styx-resolution-domain"
to = ["styx-resolution-application", "styx-resolution-infrastructure"]
message = "domain is the innermost layer: it declares ports and owns error types, and depends outward on nothing but styx-proto and third-party crates. Move the type into domain, or invert the call behind a port that infrastructure implements"

[[deny-scope-dep]]
name = "resolution-application-to-infrastructure"
from = "styx-resolution-application"
to = ["styx-resolution-infrastructure"]
message = "application orchestrates over the ports declared in domain; it must not know which adapter implements them. Depend on the port, and let the styx binary inject the adapter at startup"

[[deny-scope-dep]]
name = "recursion-domain-outward"
from = "styx-recursion-domain"
to = ["styx-recursion-application", "styx-recursion-infrastructure"]
message = "domain is the innermost layer: the Descent state machine is I/O-free and depends outward on nothing but styx-proto and third-party crates. Move the type into domain, or invert the call behind a port that infrastructure implements"

[[deny-scope-dep]]
name = "recursion-application-to-infrastructure"
from = "styx-recursion-application"
to = ["styx-recursion-infrastructure"]
message = "application orchestrates over the ports declared in domain (Transport, InfraCache, DiagnosticsSink, ChainMaterialSink); it must not know which adapter implements them. Depend on the port, and let the styx binary inject the adapter at startup"

[[deny-scope-dep]]
name = "filtering-domain-outward"
from = "styx-filtering-domain"
to = ["styx-filtering-application", "styx-filtering-infrastructure"]
message = "domain is the innermost layer: it declares ports and owns error types, and depends outward on nothing but styx-proto and third-party crates. Move the type into domain, or invert the call behind a port that infrastructure implements"

[[deny-scope-dep]]
name = "filtering-application-to-infrastructure"
from = "styx-filtering-application"
to = ["styx-filtering-infrastructure"]
message = "application orchestrates over the ports declared in domain; it must not know which adapter implements them. Depend on the port, and let the styx binary inject the adapter at startup"

[[deny-scope-dep]]
name = "proto-domain-outward"
from = "styx-proto-domain"
to = ["styx-proto-application", "styx-proto-infrastructure"]
message = "domain is the innermost layer: it declares ports and owns error types, and depends outward on nothing. Move the type into domain, or invert the call behind a port"

[[deny-scope-dep]]
name = "proto-application-to-infrastructure"
from = "styx-proto-application"
to = ["styx-proto-infrastructure"]
message = "application orchestrates over the ports declared in domain; it must not know which adapter implements them"

[[deny-scope-dep]]
name = "core-domain-outward"
from = "styx-core-domain"
to = ["styx-core-infrastructure"]
message = "domain is the innermost layer: it declares ports and owns error types, and depends outward on nothing but styx-proto and third-party crates. Move the type into domain, or invert the call behind a port that infrastructure implements"

[[deny-scope-dep]]
name = "net-domain-outward"
from = "styx-net-domain"
to = ["styx-net-infrastructure"]
message = "domain is the innermost layer: the exchange's value and error types depend outward on nothing but styx-proto and third-party crates. Sockets and framing belong in infrastructure"

# ===========================================================================
# Feature isolation — Structure rules 4-7.
#
# Note what is NOT written here: there is no rule of the form "no crate may
# name another workspace crate". That phrasing would forbid styx-proto and
# break the entire build. Each rule denies specific sibling feature crates, so:
#
#   - styx-proto is exempt as a TARGET by never appearing in a deny list
#     (everyone may name it), and is bound as a SOURCE by the last rule below.
#   - styx-web (phase 11) and the styx binary are exempt BY CONSTRUCTION: the
#     rules below are scoped to feature crates, and neither is one. This is
#     why no `except` entry is needed for either, and why adding styx-web in
#     phase 11 requires no change here.
#   - New feature crates must be added to every rule below. A crate without
#     its scopes is a defect, not an omission: the rules would simply not
#     apply to it and the gate would pass in silence.
# ===========================================================================

[[restrict-use]]
name = "no-resolution-to-filtering"
scope = "styx-resolution"
deny = ["styx_filtering", "styx_filtering::**", "styx_recursion", "styx_recursion::**"]
message = "feature crates must not name each other. styx-resolution declares a FilterPolicy port in its domain module and the styx binary wires styx-filtering into it; a direct dependency makes the isolation a rewrite to recover"

[[restrict-use]]
name = "no-filtering-to-resolution"
scope = "styx-filtering"
deny = ["styx_resolution", "styx_resolution::**", "styx_recursion", "styx_recursion::**"]
message = "feature crates must not name each other. Declare a port in this crate's domain module and let the styx binary inject the adapter"

[[restrict-use]]
name = "no-recursion-to-feature"
scope = "styx-recursion"
deny = ["styx_resolution", "styx_resolution::**", "styx_filtering", "styx_filtering::**"]
message = "feature crates must not name each other. styx-recursion implements styx-core's Upstream port, and the styx binary puts it in styx-resolution's pool; neither crate names the other"

[[restrict-use]]
name = "proto-names-no-feature"
scope = "styx-proto"
deny = ["styx_resolution", "styx_resolution::**", "styx_filtering", "styx_filtering::**", "styx_recursion", "styx_recursion::**"]
message = "styx-proto is shared foundation: it is exempt from feature isolation as a dependency target, not as a source. Every crate parses through the wire codec, so the codec must depend on none of them"

[[restrict-use]]
name = "proto-names-no-core"
scope = "styx-proto"
deny = ["styx_core", "styx_core::**", "styx_net", "styx_net::**"]
message = "styx-proto is the wire codec and bottom-most shared foundation crate; styx-core and styx-net depend on styx-proto, never the reverse"

[[restrict-use]]
name = "core-names-no-feature"
scope = "styx-core"
deny = ["styx_resolution", "styx_resolution::**", "styx_filtering", "styx_filtering::**", "styx_recursion", "styx_recursion::**"]
message = "styx-core is shared foundation: it is exempt from feature isolation as a dependency target, not as a source. Core contracts and ports must depend on no feature crate"

[[restrict-use]]
name = "core-names-no-net"
scope = "styx-core"
deny = ["styx_net", "styx_net::**"]
message = "styx-core sits below styx-net: styx-net depends on styx-core for the Clock port, never the reverse"

[[restrict-use]]
name = "testkit-names-no-feature"
scope = "styx-testkit"
deny = ["styx_resolution", "styx_resolution::**", "styx_filtering", "styx_filtering::**", "styx_recursion", "styx_recursion::**"]
message = "styx-testkit is a dev-dependency of every feature crate. Naming one would create a dependency cycle through those dev edges; harness pieces that wrap a feature crate's own types stay in that crate's tests"

[[restrict-use]]
name = "net-names-no-feature"
scope = "styx-net"
deny = ["styx_resolution", "styx_resolution::**", "styx_filtering", "styx_filtering::**", "styx_recursion", "styx_recursion::**"]
message = "styx-net is shared foundation: it is exempt from feature isolation as a dependency target, not as a source. The outbound exchange every feature shares must depend on none of them"

# ===========================================================================
# Synchronous I/O by layer (amendment, 2026-09-24).
#
# `no-sync-io` (AL002) does not reliably reach ordinary, idiomatic sync I/O:
# verified against arch-lint 0.6.0 directly, it matches a literal, fully
# qualified path written inline (`std::fs::read_to_string(..)`) or a small
# set of bare method names (`.is_dir()` and similar) — regardless of whether
# the enclosing function is async, which is a narrower guarantee than "async
# contexts only". What it does NOT catch is the far more common idiom: a
# `use` import followed by the short name (`use std::fs::read_to_string; ...
# read_to_string(..)`), which is exactly Fixture F's shape and is invisible
# to AL002 while `[[restrict-use]]` resolves it correctly (it "expands
# grouped imports and also checks inline qualified paths",
# arch-lint-core-0.6.0/src/declarative/rules/restrict_use.rs). The invariant
# these five rules express is about the LAYER, not about import style or
# async-ness, and AL002 cannot express that regardless of which gap is
# widest in practice. AL002 stays enabled and still covers whatever
# fully-qualified sync calls appear in `infrastructure`, which these rules
# deliberately do not reach.
#
# The deny list names specific types, traits and functions, never all of
# std::net or std::io: std::net::IpAddr is a value type Phase 2's ClientId
# wraps in `domain`, and a port's error enum may legitimately name
# std::io::ErrorKind. Denying the parent module would forbid those too.
# ===========================================================================

[[restrict-use]]
name = "no-sync-io-resolution-domain"
scope = "styx-resolution-domain"
deny = [
    "std::fs",
    "std::fs::**",
    "std::net::TcpStream",
    "std::net::TcpListener",
    "std::net::UdpSocket",
    "std::net::ToSocketAddrs",
    "std::io::Read",
    "std::io::Write",
    "std::io::BufRead",
    "std::io::Seek",
    "std::io::prelude",
    "std::io::prelude::**",
    "std::io::stdin",
    "std::io::stdout",
    "std::io::stderr",
]
message = "the hot path touches no I/O: matcher state is in memory, built at boot and on reload. A synchronous call here is a latent violation of that guarantee — move it behind a port implemented in infrastructure"

[[restrict-use]]
name = "no-sync-io-resolution-application"
scope = "styx-resolution-application"
deny = [
    "std::fs",
    "std::fs::**",
    "std::net::TcpStream",
    "std::net::TcpListener",
    "std::net::UdpSocket",
    "std::net::ToSocketAddrs",
    "std::io::Read",
    "std::io::Write",
    "std::io::BufRead",
    "std::io::Seek",
    "std::io::prelude",
    "std::io::prelude::**",
    "std::io::stdin",
    "std::io::stdout",
    "std::io::stderr",
]
message = "a database outage must degrade logging and admin, never resolution. A synchronous call here is a latent violation of that guarantee — move it behind a port implemented in infrastructure"

[[restrict-use]]
name = "no-sync-io-filtering-domain"
scope = "styx-filtering-domain"
deny = [
    "std::fs",
    "std::fs::**",
    "std::net::TcpStream",
    "std::net::TcpListener",
    "std::net::UdpSocket",
    "std::net::ToSocketAddrs",
    "std::io::Read",
    "std::io::Write",
    "std::io::BufRead",
    "std::io::Seek",
    "std::io::prelude",
    "std::io::prelude::**",
    "std::io::stdin",
    "std::io::stdout",
    "std::io::stderr",
]
message = "the hot path touches no I/O: matcher state is in memory, built at boot and on reload. A synchronous call here is a latent violation of that guarantee — move it behind a port implemented in infrastructure"

[[restrict-use]]
name = "no-sync-io-filtering-application"
scope = "styx-filtering-application"
deny = [
    "std::fs",
    "std::fs::**",
    "std::net::TcpStream",
    "std::net::TcpListener",
    "std::net::UdpSocket",
    "std::net::ToSocketAddrs",
    "std::io::Read",
    "std::io::Write",
