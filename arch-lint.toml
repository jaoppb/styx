# ===========================================================================
# `anyhow` by crate (amendment, 2026-09-24).
#
# `require-thiserror` (AL005) checks that a type named `*Error` derives
# `thiserror::Error`. It says nothing about `anyhow`, which passes it in any
# crate. Every fallible operation in a library crate returns a crate-owned
# `thiserror` enum (Norm 3); the styx binary and xtask are exempt BY
# CONSTRUCTION, the same way styx-web is exempt from feature isolation: no
# rule below is scoped to either of them.
# ===========================================================================

[[restrict-use]]
name = "no-anyhow-proto"
scope = "styx-proto"
deny = ["anyhow", "anyhow::**"]
message = "library crates return a crate-owned thiserror enum, never anyhow (Norm 3). anyhow is reserved for the styx binary's own startup errors and for xtask, which reports a verdict to a human rather than exposing a library boundary"

[[restrict-use]]
name = "no-anyhow-core"
scope = "styx-core"
deny = ["anyhow", "anyhow::**"]
message = "library crates return a crate-owned thiserror enum, never anyhow (Norm 3). anyhow is reserved for the styx binary's own startup errors and for xtask, which reports a verdict to a human rather than exposing a library boundary"

[[restrict-use]]
name = "no-anyhow-testkit"
scope = "styx-testkit"
deny = ["anyhow", "anyhow::**"]
message = "styx-testkit is a library crate with its own thiserror HarnessError (Norm 3); anyhow is reserved for the styx binary and xtask"

[[restrict-use]]
name = "no-anyhow-net"
scope = "styx-net"
deny = ["anyhow", "anyhow::**"]
message = "library crates return a crate-owned thiserror enum, never anyhow (Norm 3). anyhow is reserved for the styx binary's own startup errors and for xtask, which reports a verdict to a human rather than exposing a library boundary"

[[restrict-use]]
name = "no-anyhow-resolution"
scope = "styx-resolution"
deny = ["anyhow", "anyhow::**"]
message = "library crates return a crate-owned thiserror enum, never anyhow (Norm 3). anyhow is reserved for the styx binary's own startup errors and for xtask, which reports a verdict to a human rather than exposing a library boundary"

[[restrict-use]]
name = "no-anyhow-recursion"
scope = "styx-recursion"
deny = ["anyhow", "anyhow::**"]
message = "library crates return a crate-owned thiserror enum, never anyhow (Norm 3). RecursionError is the one error type at this crate's boundary"

[[restrict-use]]
name = "no-anyhow-filtering"
scope = "styx-filtering"
deny = ["anyhow", "anyhow::**"]
message = "library crates return a crate-owned thiserror enum, never anyhow (Norm 3). anyhow is reserved for the styx binary's own startup errors and for xtask, which reports a verdict to a human rather than exposing a library boundary"
