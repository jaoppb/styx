[package]
name = "styx-resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "styx resolution feature crate."

[dependencies]
styx-proto = { path = "../styx-proto" }
styx-core = { path = "../styx-core" }
styx-net = { path = "../styx-net" }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
socket2.workspace = true
serde.workspace = true
toml.workspace = true
ring.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
base64.workspace = true
time.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

[dev-dependencies]
styx-core = { path = "../styx-core", features = ["test-support"] }
hickory-proto.workspace = true
styx-testkit = { path = "../styx-testkit" }
criterion.workspace = true
stats_alloc.workspace = true
tracing-subscriber.workspace = true
# The DoH test client: hyper's HTTP/2 client, and h2 directly to read the stream ceiling
# the server advertises in its SETTINGS.
hyper = { workspace = true, features = ["client"] }
h2.workspace = true

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "listener_concurrency"
harness = false

[[bench]]
name = "cache_hit"
harness = false

[lints]
workspace = true
