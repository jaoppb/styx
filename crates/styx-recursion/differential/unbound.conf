# Local unbound for the Phase 5 differential run (`just differential`).
#
# Configured comparably to styx's recursor: iterative from the root, relaxed QNAME
# minimisation, no DNSSEC validation (styx has no validator yet, so validating
# here would make bogus-signed names disagree for a reason this phase does not
# test), no cache prefetch, and no forwarding.
server:
    interface: 127.0.0.1
    port: 5353
    do-ip6: no
    do-daemonize: no
    use-syslog: no
    logfile: ""
    verbosity: 0
    chroot: ""
    username: ""
    directory: ""
    pidfile: ""
    access-control: 127.0.0.0/8 allow
    module-config: "iterator"
    qname-minimisation: yes
    qname-minimisation-strict: no
    harden-glue: yes
    prefetch: no
    # Relative to the repository root, where `just differential` runs unbound.
    root-hints: "config/named.root"
    # Triaged disagreement (2026-10-06): unbound answers 1.0.0.127.in-addr.arpa PTR
    # with "localhost." from its built-in RFC 6761 §6.3 local zone, while the
    # authoritative in-addr.arpa servers answer NXDOMAIN (AA) — which is what styx
    # returns, having no local zones of its own (local records are a pipeline
    # stage, not the recursor's). Turn the default off so unbound resolves it.
    local-zone: "127.in-addr.arpa." nodefault
